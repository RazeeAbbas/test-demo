name: Enhanced CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Linting
      - name: Run linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      # 5. Validation
      - name: Validate Python files
        run: |
          python -m compileall .

      # 6. Build
      - name: Build application
        run: |
          mkdir -p build
          if [ -f app.py ]; then
            cp app.py build/
          else
            echo "app.py not found, copying all python files instead"
            cp *.py build/ 2>/dev/null || touch build/app.py
          fi

      # 7. Basic test
      - name: Run tests
        run: |
          pytest || true

      # 8. Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: build/

      # 9. Check secret availability
      - name: Check secret availability
        env:
          MY_DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$MY_DEMO_SECRET" ]; then
            echo "Demo secret is available."
          else
            echo "Demo secret is NOT available."
          fi